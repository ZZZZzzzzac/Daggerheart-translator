<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><style>__CSS__</style></head><body><main id="app">
<header><div class="headline"><h1 id="itemTitle"></h1><span id="progress"></span><button id="moreButton" aria-expanded="false">更多</button></div><div class="subline"><span id="itemMeta"></span><span id="notice" role="status" aria-live="polite"></span></div></header>
<section id="reading"><div class="readingbar"><select id="contextMode" aria-label="上下文范围"><option value="focus">相关完整段落</option><option value="full">完整条目上下文</option><option value="related">关联上下文与依据</option></select><div class="pager"><button id="textPrev" aria-label="上一页文本">‹</button><span id="textPosition" aria-live="polite"></span><button id="textNext" aria-label="下一页文本">›</button></div></div><div class="columns"><section class="panel"><h2 id="leftTitle">原文</h2><div id="original" class="pageText"></div></section><section class="panel"><h2 id="rightTitle">现译</h2><div id="translation" class="pageText"></div></section></div></section>
<section id="assessment"><div class="assessmentbar"><strong>问题与建议</strong><div class="pager"><button id="notePrev" aria-label="上一页判断">‹</button><span id="notePosition"></span><button id="noteNext" aria-label="下一页判断">›</button></div></div><div id="judgment" class="pageText"></div></section>
<footer aria-label="审阅常用操作"><span id="position"></span><div class="actions"><button id="previous">上一条</button><button id="next">下一条</button><button id="complete" class="primary">完成，下一条 ✓</button><a id="sourceLink" class="source-action" target="_blank" rel="noopener noreferrer" aria-disabled="true" tabindex="-1" hidden>转到来源 ↗</a></div></footer>
</main>
<dialog id="more"><div class="dialoghead"><h2>更多</h2><button id="closeMore">关闭</button></div><label>查看<select id="view"><option value="todo">待办</option><option value="done">已完成，可撤销</option></select></label><label>分类<select id="status"><option value="all">全部</option><option value="confirmed">确认问题</option><option value="uncertain">待核实</option></select></label><label>搜索<input id="query" type="search" placeholder="标题、ID或全文"></label><button id="clearFilters">清空筛选</button><hr><button id="exportProgress">导出进度JSON</button><button id="importProgress">导入并合并进度</button><input id="importFile" type="file" accept=".json,application/json" hidden><p>自动保存于当前浏览器。file://、隐私模式、移动文件或换浏览器时不保证持久保存，请导出备份。导入只合并完成项，不清空已有进度。</p><p id="storageWarning" role="alert" hidden></p><details><summary>范围、版本与出处</summary><p id="reportNotes"></p><div id="evidenceLinks"></div></details></dialog>
<noscript>此报告的逐条阅读与分页需要JavaScript。请在支持JavaScript的浏览器中打开。</noscript>
<script id="report-data" type="application/json">__DATA__</script><script>__JS__</script></body></html>
